<div class="wrapper" dir="rtl">

  <aside
    class="sidebar d-flex flex-column"
    [class.collapsed]="isSidebarCollapsed"
  >

    <div class="sidebar-header p-3">
      <h5 class="mb-0">Graph KB</h5>
      <small>پایگاه دانش</small>
    </div>

    <nav class="nav flex-column flex-grow-1 mt-3">

      <a
        class="nav-link"
        routerLink="statistics"
        routerLinkActive="active"
      >
        <i class="bi bi-bar-chart"></i>
        <span>آمار داشبورد</span>
      </a>

      <a
        class="nav-link"
        routerLink="websites"
        routerLinkActive="active"
      >
        <i class="bi bi-globe2"></i>
        <span>وب‌سایت‌ها</span>
      </a>

      <div class="chat-section">

        <button
          type="button"
          class="nav-link chat-toggle w-100 border-0 text-end"
          (click)="toggleChats()"
        >
          <i class="bi bi-chat-dots"></i>

          <span>گفتگوها</span>

          <i
            class="bi me-auto"
            [class.bi-chevron-down]="!isChatsExpanded"
            [class.bi-chevron-up]="isChatsExpanded"
          ></i>
        </button>

        @if (isChatsExpanded) {

          <div class="chat-list">

            @if (chats().length === 0) {

              <div class="text-center text-secondary small py-3">
                گفتگویی وجود ندارد.
              </div>

            } @else {

              @for (chat of chats(); track chat.id) {

                <button
                  type="button"
                  class="chat-item w-100 border-0 text-end"
                  [class.active]="activeChatId() === chat.id"
                  (click)="openChat(chat.id)"
                >
                  <i class="bi bi-chat-left-text"></i>

                  <span class="text-truncate">
                    {{ chat.title }}
                  </span>
                </button>

              }

            }

          </div>

        }

      </div>
      @if (currentUser()?.role === 'admin') {
        <a
          class="nav-link"
          routerLink="users"
          routerLinkActive="active"
        >
          <i class="bi bi-people"></i>
          <span>کاربران</span>
        </a>
      }

      <button
        class="btn btn-danger mt-auto mb-3 mx-3"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right me-2"></i>
        خروج
      </button>

    </nav>

  </aside>

  <main
    class="main-content"
    [class.shrink]="!isSidebarCollapsed"
  >

    <button
      class="btn btn-light toggle-btn shadow-sm"
      [class.collapsed]="isSidebarCollapsed"
      (click)="toggleSidebar()"
    >
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- <h1 class="mb-4">داشبورد</h1> -->

    <router-outlet></router-outlet>

  </main>

</div>
