<div class="wrapper" dir="rtl">

  <aside
    class="sidebar d-flex flex-column"
    [class.collapsed]="isSidebarCollapsed"
  >

    <div class="sidebar-header p-3">
      <h5 class="mb-0">Graph KB</h5>
      <small>پایگاه دانش</small>
    </div>

    <nav class="nav flex-column flex-grow-1 mt-3">

      <a
        class="nav-link"
        routerLink="websites"
        routerLinkActive="active"
      >
        <i class="bi bi-globe2"></i>
        <span>وب‌سایت‌ها</span>
      </a>

      <a class="nav-link disabled">
        <i class="bi bi-chat-dots"></i>
        <span>گفتگوها</span>
      </a>

      <button
        class="btn btn-danger mt-auto mb-3 mx-3"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right me-2"></i>
        خروج
      </button>

    </nav>

  </aside>

  <main
    class="main-content"
    [class.shrink]="!isSidebarCollapsed"
  >

    <button
      class="btn btn-light toggle-btn shadow-sm"
      [class.collapsed]="isSidebarCollapsed"
      (click)="toggleSidebar()"
    >
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- <h1 class="mb-4">داشبورد</h1> -->

    <router-outlet></router-outlet>

  </main>

</div>
