<div class="wrapper">
  <div class="main-content" [class.shrink]="!isSidebarCollapsed">
    <h1 class="mb-4">Dashboard</h1>
    <router-outlet></router-outlet>
  </div>

  <button
    class="btn btn-light toggle-btn shadow-sm"
    [class.collapsed]="isSidebarCollapsed"
    (click)="toggleSidebar()"
  >
    <i class="bi bi-list fs-5"></i>
  </button>

  <aside class="sidebar d-flex flex-column" id="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header p-3">
      <div class="d-flex align-items-center justify-content-between">
        <h5 class="mb-0">Dashboard</h5>
      </div>
    </div>

    <nav class="nav flex-column flex-grow-1 mt-2">
      <a
        class="nav-link"
        routerLink="websites"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-folder me-2"></i>
        Websites
      </a>
      <button class="btn btn-danger mt-auto mb-3 mx-3" (click)="logout()">
        Logout
      </button>
    </nav>
  </aside>
</div>
