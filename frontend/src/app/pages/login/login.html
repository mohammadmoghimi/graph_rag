<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-5">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h3 class="text-center mb-4">Graph RAG</h3>

          @if (errorMessage){
              <div class="alert alert-danger">
                {{ errorMessage }}
              </div>
          }

          <form (ngSubmit)="login()">

            <div class="mb-3">
              <label class="form-label">Username</label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="username"
                name="username"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>

              <input
                type="password"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                required
              >
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
            >
              Login
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
