<div class="knowledge-modal">
  <div class="knowledge-background">
    <div class="grid"></div>

    <div class="orbital orbital-1"></div>
    <div class="orbital orbital-2"></div>
    <div class="orbital orbital-3"></div>

    <div class="data-stream stream-1"></div>
    <div class="data-stream stream-2"></div>
    <div class="data-stream stream-3"></div>
    <div class="data-stream stream-4"></div>
    <div class="data-stream stream-5"></div>
    <div class="data-stream stream-6"></div>
  </div>

  <div class="modal-content">
    <div class="core-container">
      <div class="core-glow"></div>
      <div class="core">
        <i class="bi bi-stars"></i>
      </div>
    </div>

    <h3>{{ title }}</h3>

    <p class="subtitle">
      سیستم در حال پردازش و سازمان‌دهی اطلاعات است
    </p>

    <div class="pipeline">
      <div class="pipeline-item active">
        <div class="status-icon">
          <i class="bi bi-file-earmark-text"></i>
        </div>
        <span>خواندن محتوا</span>
      </div>

      <div class="pipeline-line"></div>

      <div class="pipeline-item active delay-1">
        <div class="status-icon">
          <i class="bi bi-scissors"></i>
        </div>
        <span>تقسیم‌بندی محتوا</span>
      </div>

      <div class="pipeline-line"></div>

      <div class="pipeline-item active delay-2">
        <div class="status-icon">
          <i class="bi bi-cpu"></i>
        </div>
        <span>ساخت embedding</span>
      </div>

      <div class="pipeline-line"></div>

      <div class="pipeline-item active delay-3">
        <div class="status-icon">
          <i class="bi bi-diagram-3"></i>
        </div>
        <span>استخراج موجودیت‌ها</span>
      </div>

      <div class="pipeline-line"></div>

      <div class="pipeline-item active delay-4">
        <div class="status-icon">
          <i class="bi bi-share"></i>
        </div>
        <span>ساخت گراف دانش</span>
      </div>

      <div class="pipeline-line"></div>

      <div class="pipeline-item active delay-5">
        <div class="status-icon">
          <i class="bi bi-lightning-charge"></i>
        </div>
        <span>آماده‌سازی جستجو</span>
      </div>
    </div>

    <div class="processing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>
