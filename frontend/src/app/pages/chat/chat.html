<div class="container-fluid h-100" dir="rtl">

  @if (isLoading) {
    <div class="d-flex justify-content-center align-items-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
  } @else if (chat) {

    <div class="d-flex flex-column vh-100">

      <div class="border-bottom py-3">
        <h5 class="fw-semibold mb-2">{{ chat.title }}</h5>

        <div class="d-flex flex-wrap gap-2">
          @for (website of chat.websites; track website.id) {
            <span class="badge text-bg-light border">
              <i class="bi bi-globe2 me-1"></i>
              {{ website.name }}
            </span>
          }
        </div>
      </div>

      <div class="flex-grow-1 overflow-auto py-4">

        <div class="text-center text-secondary mt-5">
          <i class="bi bi-chat-dots display-5"></i>

          <h5 class="mt-3">
            گفتگو را شروع کنید
          </h5>

          <p>
            درباره محتوای وب‌سایت‌های انتخاب‌شده سؤال بپرسید.
          </p>
        </div>

      </div>

      <div class="border-top py-3">
        <form
          class="d-flex gap-2"
          (ngSubmit)="sendMessage()"
        >

          <input
            class="form-control form-control-lg"
            [(ngModel)]="message"
            name="message"
            placeholder="سؤال خود را بنویسید..."
            autocomplete="off"
          >

          <button
            class="btn btn-primary px-4"
            [disabled]="!message.trim()"
          >
            <i class="bi bi-send"></i>
          </button>

        </form>
      </div>

    </div>

  }

</div>
